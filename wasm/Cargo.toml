[package]
name = "rickview-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Client-side WebAssembly viewer for HDT files"
repository = "https://github.com/KonradHoeffner/rickview"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rickview = { path = "..", default-features = false, features = ["hdt"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
log = "0.4"

[package.metadata.wasm-pack.profile.release]
# The bundled wasm-opt cannot validate the v128 instructions from +simd128.
wasm-opt = false
